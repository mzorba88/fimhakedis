name: Verify FIM Hakedis
on:
  pull_request:
  push:
    branches:
      - feat/kesin-hesap-ek-is-4b
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run test -- --run
      - run: npm run build
